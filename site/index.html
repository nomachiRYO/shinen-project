<script>
const SPECIAL_DATA={"NORB": {"skill": "天啓の眼（てんけいのめ）", "skill_desc": "まだ誰も気づいていない「兆し」を読み取る。時間を超えて情報を受信する、予知に近い直感力。", "good_spirit": "先祖霊・守護霊", "good_desc": "あなたの重く誠実な感性に、先祖や守護の存在は信頼を寄せる。重要な予感の多くは、彼らからの伝言かもしれない。", "bad_spirit": "浮遊霊・未練霊", "bad_desc": "強い未練を持つ霊はあなたの受信機に入り込みやすく、根拠のない不安や悪夢として現れることがある。"}, "NORF": {"skill": "痛みの依代（いたみのよりしろ）", "skill_desc": "他者の感情的・霊的な痛みを自分の体で受け取り、浄化して還す。意識せずとも「場を癒す」力。", "good_spirit": "悲しみの霊・地縛霊（穏やかなもの）", "good_desc": "まだ誰にも気づかれず泣いている存在があなたのそばに集まる。あなたがそこにいるだけで、彼らは少し軽くなる。", "bad_spirit": "生霊・強い感情霊", "bad_desc": "誰かの強い嫉妬や執着がそのままあなたに届いてしまう。原因不明の体の重さや気力の低下はこれかもしれない。"}, "NOKB": {"skill": "世界語の翻訳（せかいごのほんやく）", "skill_desc": "偶然の一致、夢、数字、言葉のサイン——目に見えない世界からのメッセージを読み解く、独自の解読力。", "good_spirit": "自然霊・精霊", "good_desc": "木や水や空気に宿る精霊たちがあなたに語りかけやすい。「なぜか気になる場所」には、彼らの声がある。", "bad_spirit": "幻惑霊・誘惑霊", "bad_desc": "サインを読む力が強いぶん、意図的に誤った方向へ誘う存在に乗せられることがある。読みすぎには要注意。"}, "NOKF": {"skill": "境界の通過（きょうかいのつうか）", "skill_desc": "こちら側とあちら側の境目をすり抜ける感性。夢と現実、自分と他者の境が薄く、二つの世界に同時に触れられる。", "good_spirit": "旅する霊・迷い人の霊", "good_desc": "どこにも属せず彷徨う存在が、同じく境界を生きるあなたに親しみを感じる。あなたと出会った霊は少し安らぐ。", "bad_spirit": "憑依霊", "bad_desc": "境界が薄いあなたに入り込もうとする存在がいる。自分が誰だか分からなくなる感覚は、その影響かもしれない。"}, "XORB": {"skill": "霊的執行権（れいてきしっこうけん）", "skill_desc": "見えないものに名前を与え、居場所を定め、扱えるものに変える力。混沌を秩序に変える、霊界の実務能力。", "good_spirit": "格式のある霊・武士霊・神霊", "good_desc": "位の高い存在や、作法を重んじた武士や神職の霊はあなたを認める。あなたの重さと誠実さが信頼を生む。", "bad_spirit": "悪戯霊・低級霊", "bad_desc": "作法を持たない軽い存在はあなたの秩序を乱そうとする。気を張り続けることによる消耗が最大のリスク。"}, "XORF": {"skill": "神降ろし（かみおろし）", "skill_desc": "神聖なものを自分の身に宿し、顕現させる力。特定の場所や音楽で「何かが降りてくる」感覚を持つ者。", "good_spirit": "神霊・土地神・高次の存在", "good_desc": "あなたの開かれた受容性に、高い存在が降りやすい。神社やパワースポットで強く感じる気配は本物のことが多い。", "bad_spirit": "強情念の地縛霊", "bad_desc": "飲み込まれやすいあなたに、強い未練や怒りを持つ霊が同調することがある。場の影響を受けすぎたときは要注意。"}, "XOKB": {"skill": "魂の翻訳機（たましいのほんやくき）", "skill_desc": "言葉を持たない存在の意図や感情を受け取り、生きている人へ橋渡しする力。霊と人をつなぐ通訳能力。", "good_spirit": "無念の霊・伝えられなかった思いを持つ霊", "good_desc": "まだ誰かに気持ちを届けられていない存在があなたに頼る。あなたが「なんとなく気になる」場所には、そういう存在がいる。", "bad_spirit": "執着霊", "bad_desc": "どちらの気持ちも分かるぶん、執着の強い存在の感情をそのまま引き受けてしまう。境界線を引くことが鍵。"}, "XOKF": {"skill": "本能的感応（ほんのうてきかんのう）", "skill_desc": "学ばず、構えず、ただ「感じる」ことで見えない世界と接続する天性の力。理屈なしで「分かってしまう」能力。", "good_spirit": "動物霊・自然の精霊・子どもの霊", "good_desc": "純粋でシンプルな存在があなたの天然さに親しみを感じる。ペットや子どもに懐かれやすいのも同じ理由。", "bad_spirit": "試す霊・悪戯霊", "bad_desc": "無防備なあなたに悪戯をしかけてくる存在がいる。直感を信じすぎて深みにはまるのが最大のリスク。"}, "XLRB": {"skill": "霊的解析眼（れいてきかいせきがん）", "skill_desc": "「これは本当か」を最後まで問い続ける力。霊的現象も人間のトリックも、同じ目で冷静に分析する。感情に流されず、証拠と論理で偽物を選り分ける知性。", "good_spirit": "トリック・思い込み・集団心理", "good_desc": "怪奇現象の9割は、人の心と思い込みが生む錯覚——それを冷静に見抜けるのがこのタイプ。「信じたい」という空気に流されず、本物と偽物を選り分けられる。", "bad_spirit": "論理の通じない、本物", "bad_desc": "あらゆる偽物を解体してきたあなたが、どうしても説明のつかない何かに出会うとき——その時こそ、あなたの理性は初めて揺らぐ。本物は、いつも論理の外側にいる。"}, "XLRF": {"skill": "異変察知の眼（いへんさっちのめ）", "skill_desc": "「なんかおかしい」を誰より早く掴む力。言葉のズレ、空気の歪み、見落とされた矛盾——言語化できない違和感を、体が先に知っている。", "good_spirit": "嘘・矛盾・見えない危険", "good_desc": "言葉と行動のズレ、隠された意図、崩れかけた状況——あなたのセンサーは、他の人が見逃すサインを拾い上げる。「気にしすぎ」と言われるが、たいてい当たっている。", "bad_spirit": "正体を掴ませない気配", "bad_desc": "危険ならいくらでも追える。だが、追っても追っても正体を現さない気配——理由のわからない悪寒、説明できない視線。それだけは、あなたの鋭い嗅覚をもってしても掴みきれない。"}, "XLKB": {"skill": "怪異検証術（かいいけんしょうじゅつ）", "skill_desc": "未知の現象を怖がらず、好奇心で観察・記録・検証する力。「怪しい」を「面白い」に変換できる胆力。感情を切り離して現象と向き合える稀有な知性。", "good_spirit": "未解明現象・心霊スポット・怪談", "good_desc": "霊か錯覚かを問わず「不思議な現象」そのものを楽しめる。怖くないから近づける。近づけるから、誰も調べなかった真相にたどり着ける。", "bad_spirit": "検証を拒む、底なしの謎", "bad_desc": "どんな怪異も「面白い研究対象」にできるあなた。でも——いくら観察しても法則が見えず、再現も説明もできない現象に出会ったとき。好奇心が、初めて畏れに変わるかもしれない。"}, "XLKF": {"skill": "現場突破の勘（げんばとっぱのかん）", "skill_desc": "気になったら即行動、現地で直接確かめる突破力。頭で考えるより先に体が動き、行動しながら論理が追いつく。動くことで初めて見える真実がある。", "good_spirit": "謎・未確認情報・現場の違和感", "good_desc": "「本当かどうか、行って確かめればいい」と思えるのが強み。現場に立てば、机の前では見えなかった答えが転がっている。動いた者にしか、真相は見えない。", "bad_spirit": "足を止めさせる、何か", "bad_desc": "どんな現場にも飛び込めるあなた。でも——なぜか足が前に出ない場所、理由もなく「ここから先はだめだ」と体が拒む瞬間がある。その勘だけは、いつも理屈より正しい。"}, "NLRB": {"skill": "静観の眼（せいかんのめ）", "skill_desc": "飲まれず、騒がず、ただ観る。感情の渦の外側から、物事の本質だけを静かに見極める力。何かが起きても反応せず、事実を事実として受け取る冷静さ。", "good_spirit": "静かな異変・歴史の痕跡", "good_desc": "古い建物や史跡など、長い時間が積み重なった場所の「空気」を敏感に感じ取る。騒がず、ただそこにある何かを静かに受け止められる。", "bad_spirit": "注目・反応を求める存在", "bad_desc": "「怖い」「何かいる」と騒ぎ立てる人、反応を期待して大げさに演じる人が苦手。あなたの無反応が、場をさらに盛り上げようとする人を刺激することがある。"}, "NLRF": {"skill": "真偽保留術（しんぎほりゅうじゅつ）", "skill_desc": "霊か否か、本物か思い込みか——どちらとも断定せず、保留しながら真実に近づく知的誠実さ。「分からない」を「分からない」と言える、稀有な誠実さ。", "good_spirit": "曖昧な事象・未解明の出来事", "good_desc": "白黒つけられない現象に、誰よりも長く付き合える。「これは霊か、錯覚か」を急いで結論づけず、じっくり観察し続けることができる。", "bad_spirit": "断定・急かし・強引な結論", "bad_desc": "「絶対に霊だ」「絶対に気のせいだ」と断言する人の両方が苦手。保留を続けるあなたに「優柔不断」と苛立ちをぶつけてくる場面で消耗する。"}, "NLKB": {"skill": "日常結界（にちじょうけっかい）", "skill_desc": "乱れない日常の中に、自然と境界線を張る力。「普通の暮らし」を守り続けることが、最強の安定につながる。何があっても自分のペースを崩さない強さ。", "good_spirit": "穏やかな場・土地の記憶", "good_desc": "長く住まわれた家、手入れされた庭、静かな古い建物——その場所に積み重なった穏やかな時間の空気を自然と受け取り、共存できる。", "bad_spirit": "混乱・急変・ルーティンの破壊", "bad_desc": "急な予定変更、日常を乱すできごと、秩序が崩れる場面が最も苦手。外側からの混乱が、あなたの安定した世界を揺さぶってくる。"}, "NLKF": {"skill": "無縁の盾（むえんのたて）", "skill_desc": "執着しないことで、重いものを引き寄せない天然の護身力。「関係ない」と思える強さが、最強の結界になる。軽やかに手放せるから、いつも自由でいられる。", "good_spirit": "軽い雰囲気・穏やかな場所", "good_desc": "重苦しくない、執着のない、さらりとした場や人との相性が良い。あなたの「まあいいか」という軽やかさが、場の空気を自然とほぐす。", "bad_spirit": "強い執着・しつこい感情", "bad_desc": "強い執着を持つ人や、感情をぶつけてくる人が苦手。「なんで気にしないの」という怒りや悲しみを向けられると、距離を取りたくなる。"}};

るのは「誰にも気づかれず消えること」。視える者ゆえの、深い孤独の影がここにあります。"]], "truth": "ここまで読んで、「言い当てられた」と感じた部分があったかもしれません。でも、あなたが本当に知りたいのは、きっとこういうことのはず。——なぜ自分には視えてしまうのか。この力と、どう付き合えば、すり減らずに生きられるのか。視える者として生きた人たちは、その重さをどう抱えてきたのか。その答えは、まだここには書かれていません。", "lp_lead": "視えてしまう理由を知り、予言者の力を使いこなす道を。", "share": "当たりすぎてちょっと怖い…。私は【天啓の預言者】でした。\"考えすぎて眠れない\"理由が分かって、すごく救われた。", "best": [["慈愛の依代", "世界の捉え方も感じ方も近く、「痛みを抱く」相手と深く響き合う。"], ["夢幻の巡礼者", "同じ気配で世界を感じ、「意味を読む」姿に安心できる。"], ["降霊の執行者", "世界の捉え方も感じ方も近く、「作法で鎮める」相手と深く響き合う。"]], "worst": [["閃光の突撃者", "捉え方も温度も逆。「飛び込む」相手とは根本からすれ違いやすい。"], ["好奇の検証者", "捉え方も温度も逆。「面白がる」相手とは根本からすれ違いやすい。"], ["無縁の自由人", "捉え方も温度も逆。「軽く流す」相手とは根本からすれ違いやすい。"]], "special": {"skill": "天啓の眼（てんけいのめ）", "skill_desc": "まだ誰も気づいていない「兆し」を読み取る。時間を超えて情報を受信する、予知に近い直感力。", "good_spirit": "先祖霊・守護霊", "good_desc": "あなたの重く誠実な感性に、先祖や守護の存在は信頼を寄せる。重要な予感の多くは、彼らからの伝言かもしれない。", "bad_spirit": "浮遊霊・未練霊", "bad_desc": "強い未練を持つ霊はあなたの受信機に入り込みやすく、根拠のない不安や悪夢として現れることがある。"}}, "NORF": {"name": "慈愛の依代", "code": "NORF", "score": 82, "axes": [["N", "受信"], ["O", "霊的"], ["R", "畏怖"], ["F", "流動"]], "catch": ["私が抱えれば、", "世界は少し軽くなる。"], "profile": ["「あなたと話すと、なんだか安心する」——そう言われたことは、ありませんか。", "よく相談される。初対面の人にまで、深い悩みを打ち明けられる。あなたがいるだけで、その場の空気が少しやわらぐ。友達の変化に真っ先に気づくのは、いつもあなた。——本人たちは気づいていなくても、あなたに救われている人は、あなたが思っているよりずっと多いのです。", "それは、あなたの感受性が本物だからです。「優しすぎる」「気にしすぎ」と言われることがあるかもしれませんが、あなたは気にしているのではなく、本当に感じているんです。人混みで疲れるのも、誰かの変化にすぐ気づいてしまうのも、あなたがそれだけ深く世界と繋がっているから。", "あなたは、生まれつき「受信機」の感度が高いんです。他の人が気づかない、空気のかすかな揺れ、言葉にならない誰かの悲しみ——そういうものを、無意識のうちに全部受け取ってしまう。だからこそ、あなたにしか届かないものがある。", "歴史の中に、あなたと同じ体質の人がいます。古来どんな文化にも、他者の痛みを引き受ける存在がいました。人々の苦しみを我が身に移し、祈りの中で浄化してきた、巫女や聖者と呼ばれた人たち。マザー・テレサが、なぜ見ず知らずの人の手をただ握り続けられたのか。それは「同情」ではなく、相手の痛みが本当に自分のものとして流れ込んでくる体質——あなたと、同じ種類の感受性だったからです。", "あなたが持っているのは、その系譜に連なる力です。世界の負の感情を受け取り、自分という器の中でいったん預かり、浄化して還す。あなたが微笑むだけで誰かの肩の力が抜けるのは、気のせいではありません。あなたは知らないうちに、人の重荷をそっと引き受ける「依代」として、この時代を生きているのです。あなたの前でだけ、なぜかみんなが本音をこぼしていくのは——器がそれだけ澄んでいる、何よりの証拠です。"], "logs": [["人混みで理由なく消耗する", "その場の全員の感情を無意識に受信し、家に着く頃には何時間も働いたように疲れ果てている。"], ["動物や子供に本能的に懐かれる", "警戒心の強い動物や人見知りの子供が、なぜか素 ]], "catch": ["世界は、私だけに読める", "言語で、語りかけてくる。"], "profile": ["ふと時計を見ると、また同じ数字が並んでいる——あなたには、そんな「偶然」が多すぎませんか。", "頭の中で流れていた曲が、直後に店内で流れ出す。誰かのことを考えていたら、その人から連絡が来る。ふと目に入った言葉が、今の自分に刺さりすぎてドキッとする。ときには、夢で見た光景に現実が追いついてくることもある。——そしてあなたは、それを「ただの偶然」とは、どうしても思えない。", "霊的なものや不思議な存在に、どこか親しみを感じる——そんな感覚はありませんか。「いるんだろうな」と自然に思えるし、この世界の見えない側に、ごく当たり前に関心が向く。その距離の近さが、あなたの力の源です。あなたは見えない世界と「友達」のような関係で生きている。", "そしてあなたは、受け取ったサインを「かたち」にできる人です。お気に入りの石や香り、決まった散歩道、寝る前の小さな習慣——自分でも気づかないうちに、世界と交信するための「自分だけの作法」を持っている。それは迷信ではなく、受信の感度を保つための、あなたなりの装置です。", "ただ——距離が近いということは、良いものだけが来るわけではない。サインを受け取りすぎて処理しきれない夜、意味を探しすぎて疲れる日——それはあなたが弱いのではなく、受け取る力がまだ伸び続けているサインです。", "古来、こうした人は「巡礼者」と呼ばれてきました。遠い聖地を目指す者ではなく、日々の道そのものを聖地に変えてしまう者。道端の小石にも、鳥の声にも神託を読み、歩くことがそのまま祈りだった人々。あなたは、その系譜にいます。", "「考えすぎだよ」と笑われても、あなたはもう知っているはずです。世界は、気づく人にしか話しかけない。あなたの毎日にサインが多いのは——世界に選ばれて、語りかけられているからです。"], "logs": [["夢の中で答えを受け取っている", "悩んでいた問題が、ある朝の夢で鮮明に解かれている。起きた瞬間「あ、そういうことか」と分かる。眠ることが、答えを受け取る儀式になっている。"], ["知らない場所なのに、来たことがある気がする", "初めて訪れた場所なのに、「ここ、夢で見た」と感じる。デジャブではなく、夢が先に現実を見ていた。"], ["「なんとなく話しかけてみる」ことがある", "誰もいないのに、空気に向かって「いるの?」と聞いてみる。返事がある気がすることも、ある。"]], "strengths": [["世界と対話できる稀有な感性", "世界そのものが語りかけている実感を、日常的に持てる。人類のほんの一握りだけが持つ天賦。"], ["直感と知性の融合", "感じたものを即座に意味として組み立てられる。古代から続く巫女・神官の本質的能力。"], ["人生を物語として生きる力", "意味と伏線に満ちた一つの大きな物語として、人生が展開していく。"]], "shadows": [["サインを読む繊細さ", "世界のメッセージを受け取れる分、その意味を探しすぎることがある。サインは助言——あなたの意志が、常に主役だ。"], ["サインの意味を選べる力", "受け取るサインをどう解釈するかは、あなたが決められる。その選択眼が磨かれるほど、世界はより豊かに語りかけてくる。"]], "pain": ["感じていることを話すと変な人だと思われる", "現実的じゃないと言われて寂しくなる", "世界の豊かさを共有できる相手がいない"], "pain_close": "これは妄想でも現実逃避でもありません。人より多くの意味を受信できる、「夢幻の巡礼者」という感性ゆえの孤独です。あなたが見ている世界は、本物です。", "rx": ["サインを「選ぶ」目を養う方法", "読解力を依存に変えない使い方", "分かち合える相手の見つけ方"], "psy": [["鏡が映したもの", "あなたが選んだ手 ── 導き", "あなたは手を「メッセージ」として読もうとする。世界のサインを意味に変える力がここに。"], ["背後の咀嚼音", "あなたが聞いた音 ── 思考力", "あなたが今すり減らしているのは「思考力と感性」。意味を読み解きすぎて、心の燃料を使い果たしていませんか。"], ["魂が恐れるもの", "あなたが恐れた終わり ── 沈黙", "あなたが最も恐れるのは「世界が何も語らなくなること」。意味を求める魂の影がここに。"]], "truth": "あなたは夢の中で何かを「見る」。日常のあちこちでサインを受け取る。でも、こんな疑問が残ったままではないですか。——あの夢は、本当に予知だったのか。それとも、自分が見たかっただけなのか。距離が近すぎるあなたは、どうやって自分を守ればいいのか。同じように夢で見てしまった人たちは、それをどう扱ってきたのか。その答えは、まだここには書かれていません。", "lp_lead": "世界が語りかける理由を知り、その声と共に生きる道を。", "share": "当たってて鳥肌…。私は【夢幻の巡礼者】でした。\"世界が私だけに語りかける\"感覚、分かってもらえて嬉しい。", "best": [["迷宮の亡霊", "世界の捉え方も感じ方も近く、「境を越える」相手と深く響き合う。"], ["天啓の預言者", "同じ気配で世界を感じ、「未来を視る」姿に安心できる。"], ["招霊の主", "世界の捉え方も感じ方も近く、「対話でつなぐ」相手と深く響き合う。"]], "worst": [["闇切りの狩人", "捉え方も温度も逆。「危険を察する」相手とは根本からすれ違いやすい。"], ["鋼鉄の霊査官", "捉え方も温度も逆。「徹底して解く」相手とは根本からすれ違いやすい。"], ["世界平和の祈り人", "捉え方も温度も逆。「判断を保つ」相手とは根本からすれ違いやすい。"]], "special": {"skill": "夢見の千里眼（ゆめみのせんりがん）", "skill_desc": "眠っている間に、遠く離れた場所や、まだ来ていない未来を「見てしまう」力。夢は単なる夢ではなく、あなたにとっての受信装置。", "good_spirit": "自然霊・精霊", "good_desc": "木や水や空気に宿る精霊たちがあなたに語りかけやすい。「なぜか気になる場所」には、彼らの声がある。", "bad_spirit": "幻惑霊・誘惑霊", "bad_desc": "サインを読む力が強いぶん、意図的に誤った方向へ誘う存在に乗せられることがある。読みすぎには要注意。"}}, "NOKF": {"name": "迷宮の亡霊", "code": "NOKF", "score": 84, "axes": [["N", "受信"], ["O", "霊的"], ["K", "親和"], ["F", "流動"]], "catch": ["私は、二つの世界を", "同時に、生きている。"], "profile": ["みんなが見ているこの世界の、すこし奥——そこに「もうひとつの層」があるのを、感じたことはありませんか。", "みんなと同じ場所にいても、あなたはもう一段深いところまで感じ取っている。夢と現実のあいだを自由に行き来して、まだ言葉にならないものの気配に気づく。——それは、この世界「だけ」を生きる人には決して視えない景色です。", "その感覚は、まぎれもなく霊的な才能です。あなたは人より「境界」が薄い——ふつうの人には閉じている扉が、あなたには生まれつき開いている。だから、あちら側の気配を誰よりも早く受け取れるのです。", "多くの人は、自分と他人、現実と空想のあいだに、はっきりした壁を持っています。でもあなたは、その壁をあまり必要としないまま生きている。だから、人の気持ちが自然に流れ込んでくるし、夢や過去や、まだ言葉にならないものとも、つながってしまう。それは、世界で最も繊細な感性の表れです。", "昔から、二つの世界を行き来できる人がいました。シャーマン、巫女、神話の旅人——こちら側とあちら側の境を越え、誰も見たことのない景色を持ち帰る者たち。物語の中で「迷宮」は、恐ろしい試練の場であると同時に、真実へと通じる扉でもありました。あなたは、その境界を生きる者の系譜にいます。", "二つの世界をまたいで生きられる人は、ほんのひと握りしかいません。誰にも見えないものを見て、こちらとあちらをつなぐ「生きた橋」——それがあなたです。その存在は、世界が思っているよりずっと、貴重なものです。"], "logs": [["自分が誰だったか、ふと分からなくなる", "「これって本当に私の人生?」鏡を見ても自分か確信が持てない時がある。魂が肉体に緩やかに繋がっている証。"], ["夢が現実より鮮明な日がある", "夢の方が色濃く、現実の出来事が遠く感じる。夢は別世界ではなく、もう一つの確かな現実。"], ["人の感情と自分の感情の境が溶ける", "話していて「あれは私の気持ちか、相手の気持ちか」が分からなくなる。共有しすぎて輪郭が揺らぐ。"]], "strengths": [["最も繊細な層を感じる力", "世界の質感、空気の流れ、見えない繋がりを日常的に感じ取れる。芸術家や哲学者が憧れて得られない感性。"], ["境界を持たない自由", "壁がないため、誰とも何とも深く繋がれる。人が最も深い部分を見せられる安心感を与える。"], ["真実への近さ", "表面に惑わされず、物事の本質にまっすぐ辿り着ける。直感で真実に届く。"]], "shadows": [["溶け込む共鳴力", "他者や世界と深くつながれる分、感情の境界が揺らぐことがある。それはこの感性の深さの証であり、使い方を知れば、誰よりも深く世界を読む力になる。"], ["見えない世界への感応力", "境界が薄いからこそ、誰も気づかない繊細なものを感じ取れる。この感性は、正しく使えば最強の感知力になる。"]], "pain": ["どこにいても、心の片隅がここではない気がする", "人と深く関わると自分の輪郭が溶ける", "現実の手応えが薄くてふと不安になる"], "pain_close": "これは欠陥ではありません。二つの世界に同時に触れられる、「迷宮の亡霊」という稀有な感性ゆえ。あなたはどこにも馴染めないのではなく、どの世界にも居場所がある人です。", "rx": ["自分の輪郭を保つ「小さな錨」の持ち方", "溶けずに人と関わる距離の取り方", "現実に足をつける地に足の習慣"], "psy": [["鏡が映したもの", "あなたが選んだ手 ── 越境", "あなたは手を別世界からの訪れとして自然に受け取る。境を越える旅人の感性がここに。"], ["背後の咀嚼音", "あなたが聞いた音 ── 自分の輪郭", "あなたが今すり減らしているのは「自分の輪郭」。境が溶けやすいあなたは、気づけば自分の形を見失っていませんか。"], ["魂が恐れるもの", "あなたが恐れた終わり ── 喪失", "あなたが最も恐れるのは「自分の輪郭が消えること」。境が溶ける者ゆえの影がここに。"]], "truth": "ここまで読んで、ふっと心が軽くなった部分があったかもしれません。馴染めないことには、意味があったんだ、と。でも、あなたが本当に知りたいのは、きっとこういうことのはず。——なぜ自分は、二つの世界を生きているのか。溶けてしまわずに、自分を保つにはどうすればいいのか。境界を生きた人たちは、それをどう乗りこなしてきたのか。その答えは、まだここには書かれていません。", "lp_lead": "境が溶けている理由を知り、自在に渡る旅人になる道を。", "share": "当たりすぎ…。私は【迷宮の亡霊】でした。\"どこにも馴染めない\"んじゃなく\"どの世界にも居場所がある\"って救われた。", "best": [["夢幻の巡礼者", "世界の捉え方も感じ方も近く、「意味を読む」相手と深く響き合う。"], ["慈愛の依代", "同じ気配で世界を感じ、「痛みを抱く」姿に安心できる。"], ["霊界のムードメーカー", "世界の捉え方も感じ方も近く、「勘で動く」相手と深く響き合う。"]], "worst": [["鋼鉄の霊査官", "捉え方も温度も逆。「徹底して解く」相手とは根本からすれ違いやすい。"], ["闇切りの狩人", "捉え方も温度も逆。「危険を察する」相手とは根本からすれ違いやすい。"], ["崇高なるリアリスト", "捉え方も温度も逆。「静かに観る」相手とは根本からすれ違いやすい。"]], "special": {"skill": "霊域遊泳（れいいきゆうえい）", "skill_desc": "眠りと目覚めの狭間、現実と夢の境目——あなたはその「あいだ」を自由に泳ぐ。こちら側にいながら、あちら側の空気を吸っている。二つの世界を同時に生きる、天性の遊泳者。", "good_spirit": "旅する霊・迷い人の霊", "good_desc": "どこにも属せず彷徨う存在が、同じく境界を生きるあなたに親しみを感じる。あなたと出会った霊は少し安らぐ。", "bad_spirit": "憑依霊", "bad_desc": "境界が薄いあなたに入り込もうとする存在がいる。自分が誰だか分からなくなる感覚は、その影響かもしれない。"}}, "XORB": {"name": "降霊の執行者", "code": "XORB", "score": 78, "axes": [["X", "干渉"], ["O", "霊的"], ["R", "畏怖"], ["B", "構築"]], "catch": ["私は、見えないものに、", "名前と居場所を与える。"], "profile": ["あなたは、放っておけずに動いてしまう人だ。", "場の空気が「整っていない」と感じると、気づけば体が動いている。乱れた気配、淀んだ雰囲気——他の人が見て見ぬふりをするものを、あなたは見過ごせない。怖いから逃げるのではなく、どう対処するかを、先に考えている。", "これは、得体の知れないものに「形」を与える力だ。漠然とした不安に名前をつけ、居場所を定め、扱えるものに変えていく。あなたがいると、ざわついた場が鎮まり、混乱が秩序に変わる。これは、誰にでもできることではない。", "あなたは、見えないものを畏れながらも、逃げずに向き合える数少ない人間だ。だからこそ、人はあなたを頼る。あなたが動くことで、整えられてきたものが、確かにある。", "古来どんな文化にも、見えない世界と人の世の「あいだ」を取り仕切る者がいました。祈祷師、神官、祓いを司る者——畏れを抱きながらも正しい作法で向き合い、人々を守ってきた執行者たち。あなたは、その実務を継ぐ者だ。", "あなたが「やらなければ」と感じるのは、それを担うだけの力が、あなたに備わっているからだ。誰に気づかれなくとも、あなたは今日も場を整え続ける——混沌に秩序をもたらす、執行者として。"], "logs": [["放っておけない「乱れ」がある", "場に入った瞬間、何かが「整っていない」と分かる。他の人には見えていないのに、自分だけが気になって仕方ない。"], ["相談を受けると、まず『場』を整え始める", "誰かが悩みを話し始めると、無意識に部屋の換気をし、お茶を淹れ、座る場所を変える。"], ["デジャブを「気のせい」で片付けない", "「あ、これ前に夢で見たかも」と思った瞬間、それがいつ頃の感覚だったか、頭の中の記憶の棚を本気で捜索し始める。"]], "strengths": [["霊的世界の『実務化』能力", "感じたものを行動に変換できる稀有な才能。多くの霊感体質が受信で終わる中、現実を動かすところまでやり遂げる。"], ["体系化された知性", "霊的アプローチに再現性がある。これは霊感と論理を両方持つ者だけができる芸当。教えれば他人も再現できる。"], ["頼られる存在感", "見えない悩みを相談しに来られ、実際に状況が変わる。「この人に頼めば何かが動く」という信頼を積み重ねてきた。"]], "shadows": [["自分の方法論への執着", "体系が強力ゆえ「これ以外は認めない」頑固さに転じることがある。他者の流儀にも目を向ける柔軟さを。"], ["引き受けすぎて消耗する", "頼られ続けるとエネルギーが枯渇する。断る勇気もまた、儀式の一部。"]], "pain": ["頼られすぎて消耗する", "断れず引き受けて疲れる", "常に気を張っている"], "pain_close": "これは生真面目さの問題ではなく、見えないものの重さを畏れをもって受け止めてしまう感性の代償です。あなたは背負いすぎなくていい。その責任感は、本来は誇りであるべきものです。", "rx": ["引き受けすぎない「断る作法」", "霊的責任の重荷を分散する方法", "自分のための浄化ルーティン"], "psy": [["鏡が映したもの", "あなたが選んだ手 ── 作法", "あなたは手にどう応じるべきか作法を考える。見えないものを畏れ敬う執行者の感性がここに。"], ["背後の咀嚼音", "あなたが聞いた音 ── 正気の足場", "あなたが今すり減らしているのは「日常の正気」。重い責任を背負い続け、現実への足場が削られていませんか。"], ["魂が恐れるもの", "あなたが恐れた終わり ── 責任", "あなたが最も恐れるのは「守りきれないこと」。重責を背負う者の影がここに。"]], "truth": "ここまで読んで、自分の「動いてしまう理由」が、少し見えてきたかもしれない。だが、本当に知るべきはその先だ。——なぜ、あなたにだけ「場の乱れ」が視えるのか。その力を、消耗せずに使いこなす作法とは何か。混沌を統べてきた執行者たちが受け継いだ技は、まだここには書かれていない。", "lp_lead": "畏れ敬う理由を知り、重荷を分かち合う道を。", "share": "当たってる…。私は【降霊の執行者】でした。\"頼られすぎて消耗する\"理由が分かった。", "best": [["神宿りの舞手", "世界の捉え方も感じ方も近く、「神を宿す」相手と深く響き合う。"], ["天啓の預言者", "世界の捉え方も感じ方も近く、「未来を視る」相手と深く響き合う。"], ["招霊の主", "同じ気配で世界を感じ、「対話でつなぐ」姿に安心できる。"]], "worst": [["無縁の自由人", "捉え方も温度も逆。「軽く流す」相手とは根本からすれ違いやすい。"], ["無意識の結界師", "捉え方も温度も逆。「日常を守る」相手とは根本からすれ違いやすい。"], ["世界平和の祈り人", "片や気配、片や理屈。「判断を保つ」相手とは見ている世界が違う。"]], "special": {"skill": "祓いの執行（はらいのしっこう）", "skill_desc": "乱れた場を、正しい作法で鎮める力。名前のない不安に形を与え、あるべき場所へ還す。これは感じる力ではなく、動く力。見えないものと正面から向き合い、秩序をもたらす、霊的な実務者。", "good_spirit": "格式ある霊・浮かばれない霊", "good_desc": "作法と誠意をもって向き合われることを、彼らは待っている。位の高い存在も、行き場を失った霊も、あなたの「整える力」に応える。", "bad_spirit": "作法の通じない、底なしの混沌", "bad_desc": "名前も形も与えられない、ただ淀むだけの気配——論理も儀式も届かない領域がある。執行者であるあなたが、初めて手を止める瞬間がそこにある。"}}, "XORF": {"name": "神宿りの舞手", "code": "XORF", "score": 80, "axes": [["X", "干渉"], ["O", "霊的"], ["R", "畏怖"], ["F", "流動"]], "catch": ["神聖なものが、", "私の身を借りて顕れる。"], "profile": ["あなたは、その場の空気を、自分のエネルギーに変えられる人だ。", "神聖な場所、高揚する音楽、張りつめた空間——あなたはそこに満ちるものを全身で受け取り、自分を通して増幅させて放つ。「何かが降りてくる」あの感覚を、あなたは知っている。あなたがいると、場の温度が変わる。", "これは、ただ流されやすいのとは違う。あなたは場のエネルギーに飲まれるのではなく、それをドライブさせる側だ。あなたの情熱が、あなたの動きが、周囲の空気そのものを塗り替えていく。", "あなたは、頭で考えるより先に、感じたものを体で表現できる。理屈を超えて人の心を直接揺さぶれるのは、あなたが「器」であると同時に「演者」だからだ。あなたの表現には、人ならざる何かが宿る。", "古来、神聖なものを身に宿す者がいました。神楽の舞手、巫女、トランスに入る祭司——自らを明け渡し、人ならざるものを一時的に顕現させた者たち。彼らの舞や歌は、見る者の魂を震わせた。あなたには、その器の血が流れている。", "あなたの感受性は、消耗ではない。それは、世界と深く共鳴できる才能だ。あなたは、神聖なものを宿し、それを世界に解き放つ——神宿りの舞手なのだ。"], "logs": [["夢と現実の境目が曖昧な朝", "「これって夢だったか、現実だったか」と一瞬迷う。このタイプにとって夢は、もう一つの現実。"], ["シンクロニシティに、もう驚かない", "ふと思った人から連絡が来る。他の人なら「すごい」と驚くことを「またか」と感じている。"], ["初対面の人から不思議と懐かれる", "心を開きにくい人が、なぜか素直になる。相手の魂の領域に、スッと入っていける。"]], "strengths": [["二つの世界を生きる豊かさ", "人生が、他の人の二倍の情報量で満ちている。疲労にもなるが、本質的には特別な豊かさ。"], ["直感の精度の高さ", "現世だけでは説明できないソースを持つ。論理を超えた的確さがある。"], ["人の魂と接続する力", "表層でなく深層と関わる。このタイプとの関係は、普通とは違う質感を持つ。"]], "shadows": [["現世への足場の弱さ", "向こうに親しいぶん、お金・書類・時間管理が苦手になりがち。意識的に地に足をつける訓練を。"], ["自分の特殊さに無自覚", "自分に自然なことが、他人には全く自然でない。感覚を押し付けない配慮が人間関係を守る。"]], "pain": ["感情や場の空気に飲まれて消耗する", "自分が何者か分からなくなる", "強く感じすぎて疲れる"], "pain_close": "これは不安定さではなく、神聖なものを全身で受け止めてしまう感性ゆえ。あなたは流されているのではなく、誰よりも深く応えているのです。", "rx": ["飲まれずに宿す「錨の下ろし方」", "自分を取り戻す境界の作り方", "過敏な同調から回復する方法"], "psy": [["鏡が映したもの", "あなたが選んだ手 ── 憑依", "あなたは手に身を委ねる感覚を抱く。神聖を宿す依坐の感性がここに。"], ["背後の咀嚼音", "あなたが聞いた音 ── 自己同一", "あなたが今すり減らしているのは「自分という感覚」。場に同調しすぎて、自分が誰か分からなくなっていませんか。"], ["魂が恐れるもの", "あなたが恐れた終わり ── 喪我", "あなたが最も恐れるのは「自分を失うこと」。宿す者ゆえの影がここに。"]], "truth": "ここまで読んで、自分の中の「降りてくる感覚」の正体に、近づいたかもしれない。だが、本当に知るべきはその先だ。——なぜ、あなたは器になれるのか。その力を暴走させず、自在に操るにはどうすればいいのか。神聖を宿してきた舞手たちの秘儀は、まだここには書かれていない。", "lp_lead": "身に宿す理由を知り、飲まれず操る道を。", "share": "当たってる…。私は【神宿りの舞手】でした。\"場の空気に飲まれて消耗する\"のは応えすぎてたから。", "best": [["降霊の執行者", "世界の捉え方も感じ方も近く、「作法で鎮める」相手と深く響き合う。"], ["慈愛の依代", "世界の捉え方も感じ方も近く、「痛みを抱く」相手と深く響き合う。"], ["霊界のムードメーカー", "同じ気配で世界を感じ、「勘で動く」姿に安心できる。"]], "worst": [["無意識の結界師", "捉え方も温度も逆。「日常を守る」相手とは根本からすれ違いやすい。"], ["無縁の自由人", "捉え方も温度も逆。「軽く流す」相手とは根本からすれ違いやすい。"], ["崇高なるリアリスト", "片や気配、片や理屈。「静かに観る」相手とは見ている世界が違う。"]], "special": {"skill": "神降ろし（かみおろし）", "skill_desc": "神聖なものを自分の身に宿し、顕現させる力。特定の場所や音楽で「何かが降りてくる」感覚を持つ者。", "good_spirit": "神霊・土地神・高次の存在", "good_desc": "あなたの開かれた受容性に、高い存在が降りやすい。神社やパワースポットで強く感じる気配は本物のことが多い。", "bad_spirit": "強情念の地縛霊", "bad_desc": "飲み込まれやすいあなたに、強い未練や怒りを持つ霊が同調することがある。場の影響を受けすぎたときは要注意。"}}, "XOKB": {"name": "招霊の主", "code": "XOKB", "score": 72, "axes": [["X", "干渉"], ["O", "霊的"], ["K", "親和"], ["B", "構築"]], "catch": ["私は、見えない隣人と、", "日常を、共にしている。"], "profile": ["あなたは、見えないものを「招き入れる」人だ。", "怖がるでも、祓うでもなく——あなたはそこにいる存在を、自然に受け入れてしまう。気配を感じても逃げない。むしろ「どんな存在なんだろう」と興味が湧く。いつの間にか、見えない誰かと日常を共にしている。それがあなたの、普通の暮らしだ。", "あなたには、自分なりの「作法」がある。お気に入りの場所への参拝、決まった時間の儀式、丁寧に扱うお守りや小物——それは信仰というより、見えない隣人への礼儀だ。あなたが丁寧に関わるから、向こうも丁寧に返してくる。", "霊的なものを「友達」にできる人は、そう多くない。怖がる人、否定する人、利用しようとする人——そのどれでもなく、ただ「一緒にいる」ことができるのは、あなたの親和の気質があるからだ。見えない存在にとって、あなたは珍しく「安心できる人間」なのかもしれない。", "古来、神や精霊を日常に招き入れ、共に暮らしてきた人々がいました。家の神を祀り、土地の霊に語りかけ、見えないものと生活を共にしてきた者たち。特別な霊能者ではなく、ただ丁寧に、見えない世界と日常をつないだ人々。あなたは、その系譜にいる。", "あなたの日常は、見えない存在にとっても居心地がいい。それはあなたが、境界を作らず、ただ「ここにいていい」と思えるからだ。あなたは、見えない隣人を招き入れる——招霊の主なのだ。"], "logs": [["お気に入りの場所に「いる」と分かっている", "神社でも、古い建物でも、なじみのカフェでも。「ここには誰かいる」という確信が、静かにある。"], ["見えないものへの「挨拶」がある", "家を出るとき、特定の場所を通るとき、自然と一言かける。儀式というより、習慣。"], ["人間関係の修復役を頼まれる", "揉めている二人の間に立つ仕事が、なぜか回ってくる。霊的な調停も人間の調停も、同じ才能の表れ。"]], "strengths": [["共感力と戦略性の両立", "深く共感しながら、冷静に最適解を選べる。多くの人が呑まれる場面で、決して呑まれない強さ。"], ["高度なコミュニケーション能力", "言葉のある相手にもない相手にも、伝わる言葉を選べる。長年の繊細な観察の結晶。"], ["信頼を得る人柄", "人も、見えないものも、このタイプを信頼する。「安全に話を聞いてくれる」と感じさせる。"]], "shadows": [["引き受けすぎる優しさ", "他者の事情を理解しすぎ、自分の境界線を曖昧にする。すべて抱え込むと崩れる。"], ["決断の遅さ", "全方位の事情を考え、決定的な一歩が遅れる。共感と決断は両立できる。"]], "pain": ["人の間に立って消耗する", "みんなの気持ちが分かりすぎて疲れる", "自分の意見を後回しにする"], "pain_close": "これはお人好しではなく、隔たりを自然に感じ取り埋めてしまう感性ゆえ。あなたは、間に立たない時間も持っていいのです。", "rx": ["板挟みで消耗しない「線の引き方」", "自分の意見を後回しにしない練習", "つなぐ力を消耗に変えないコツ"], "psy": [["鏡が映したもの", "あなたが選んだ手 ── 和解", "あなたは手を拒まず対話を試みる。隣人として向き合う調停者の感性がここに。"], ["背後の咀嚼音", "あなたが聞いた音 ── 自尊心", "あなたが今すり減らしているのは「自尊心」。人の間に立ち、自分を後回しにし続けていませんか。"], ["魂が恐れるもの", "あなたが恐れた終わり ── 断絶", "あなたが最も恐れるのは「通じ合えないこと」。つなぐ者の影がここに。"]], "truth": "あなたは見えない隣人と、すでに日常を共にしている。だが、こんな疑問が残ってはいないか。——招き入れた存在が、本当に「良い存在」かどうか、どう見極めるのか。作法を深めると、何が変わるのか。見えない隣人と共に生きてきた人たちは、その日常をどう守ってきたのか。その答えは、まだここには書かれていない。", "lp_lead": "つなぐ力の理由を知り、消耗せず活かす道を。", "share": "当たってる…。私は【招霊の主】でした。\"間に立って消耗する\"理由が分かった。", "best": [["霊界のムードメーカー", "世界の捉え方も感じ方も近く、「勘で動く」相手と深く響き合う。"], ["夢幻の巡礼者", "世界の捉え方も感じ方も近く、「意味を読む」相手と深く響き合う。"], ["降霊の執行者", "同じ気配で世界を感じ、「作法で鎮める」姿に安心できる。"]], "worst": [["世界平和の祈り人", "捉え方も温度も逆。「判断を保つ」相手とは根本からすれ違いやすい。"], ["崇高なるリアリスト", "捉え方も温度も逆。「静かに観る」相手とは根本からすれ違いやすい。"], ["無縁の自由人", "片や気配、片や理屈。「軽く流す」相手とは見ている世界が違う。"]], "special": {"skill": "招霊の作法（しょうれいのさほう）", "skill_desc": "見えない存在を排除せず、自分の日常に自然に招き入れる力。特別な儀式ではなく、丁寧な日常そのものが、霊的な結界になる。", "good_spirit": "土地に根ざした霊・家を守る存在", "good_desc": "長く同じ場所に在り続ける存在と相性が良い。あなたの丁寧な関わり方を、彼らは好む。", "bad_spirit": "執着霊", "bad_desc": "親しく招き入れるぶん、強い執着を持つ存在が居座りやすい。「来ていい存在」と「そうでない存在」を見極める目が必要になる。"}}, "XOKF": {"name": "霊界のムードメーカー", "code": "XOKF", "score": 76, "axes": [["X", "干渉"], ["O", "霊的"], ["K", "親和"], ["F", "流動"]], "catch": ["私がいると、なぜか、", "場が、ほぐれていく。"], "profile": ["あなたは、壁を作らない人だ。", "心霊スポットで「いるー？」と声をかけてしまう。誰もいないはずの部屋で、なんとなく「おーい」と呼びかける。怖がる友人を横目に、自分だけ普通にしている——それはあなたが鈍いのではなく、怖さより先に「どんな存在なんだろう」という興味が来るからだ。", "あなたがいると、場がほぐれる。人間関係でも、霊的な空間でも。緊張していた誰かが、あなたと話すうちに自然と笑っている。重く淀んでいた場が、あなたが入ることでなぜか軽くなる。それはあなたが意図してやっているのではなく、ただそこにいるだけで起きることだ。", "これは、天性のムードメーカーの力だ。霊的なものも、人間も、あなたの前では壁を作らなくなる。「怖い」「近づくな」という空気を、あなたは軽やかに無効化してしまう。だからあなたには、他の人が気づかない存在が近づいてくる。", "古来、神事や祭りの場には必ず「場を和ませる者」がいました。道化、宴の取り持ち役、笑いで神を招く者——厳粛な空間に軽やかさをもたらし、人と神の距離を縮めた人たち。あなたの「なんとなくいける」という感覚は、その系譜に連なるものかもしれない。", "あなたがどこへ行っても馴染めるのは、見えない世界も含めて、あなたが「ここにいていいよ」と思えるからだ。あなたは、霊も人も同じように迎え入れる——霊界のムードメーカーなのだ。"], "logs": [["霊的な場所でも、普通にしていられる", "心霊スポットで友人が怯える中、自分だけなぜか平気。怖くないというより、そういう空気になれない。"], ["動物や子供に本能的に懐かれる", "警戒心の強い動物が、なぜか寄ってくる。言葉を持たない存在が、あなたの安全さを瞬時に感じ取る。"], ["準備せず、その場で最適解を出す", "事前に考えなくても、なぜかうまくいく。体がその場の空気を読んで、勝手に動いている。"]], "strengths": [["圧倒的な現場対応力", "マニュアルが通用しない場面でこそ動ける。予測不能な状況が本領発揮の場。"], ["知識を超えた直感", "学習ではなく感性で世界を理解する。本に書かれていない真実に辿り着ける。"], ["純粋な存在の引力", "動物・子供との言葉を超えた絆。純度の高い波動ゆえの、得難い宝。"]], "shadows": [["説明できない孤独", "直感は正しいのに根拠を説明できず、「なぜ?」に答えられない歯がゆさが孤立を生む。"], ["衝動的な行動の代償", "体が先に動き、後先を考えない決断で自分を追い込むことがある。直感と無謀は違う。"]], "pain": ["感じたことをうまく説明できない", "軽く見られて悔しい", "刺激に反応しすぎて疲れる"], "pain_close": "これは中身がないのではなく、世界と親しく直結している感性ゆえ。あなたの勘は、言葉になる前の本物の知性です。", "rx": ["直感を言葉にして信頼を得る方法", "刺激から自分を守る「身体の守り方」", "勘の精度を上げる記録術"], "psy": [["鏡が映したもの", "あなたが選んだ手 ── 直感", "あなたは手を一瞬で感じ取る。理屈を超えて掴む野生の感性がここに。"], ["背後の咀嚼音", "あなたが聞いた音 ── 存在感", "あなたが今すり減らしているのは「存在感」。軽く見られがちなあなたは、自分の輪郭を主張できずにいませんか。"], ["魂が恐れるもの", "あなたが恐れた終わり ── 軽視", "あなたが最も恐れるのは「勘を信じてもらえないこと」。直感の人の影がここに。"]], "truth": "あなたはどこでも馴染んでしまう。霊的な場所でも、重い空気の中でも。でも、こんな疑問が残ってはいないか。——なぜ自分だけ、あの場所で平気だったのか。近づいてくる存在の中に、本当は危ないものが混じっていないか。ムードメーカーであることの、裏側にあるリスクとは何か。その答えは、まだここには書かれていない。", "lp_lead": "勘の正体を知り、信頼される力に変える道を。", "share": "当たってる…。私は【霊界のムードメーカー】でした。\"感じたことを説明できない\"けど勘は本物だった。", "best": [["招霊の主", "世界の捉え方も感じ方も近く、「対話でつなぐ」相手と深く響き合う。"], ["迷宮の亡霊", "世界の捉え方も感じ方も近く、「境を越える」相手と深く響き合う。"], ["神宿りの舞手", "同じ気配で世界を感じ、「神を宿す」姿に安心できる。"]], "worst": [["崇高なるリアリスト", "捉え方も温度も逆。「静かに観る」相手とは根本からすれ違いやすい。"], ["世界平和の祈り人", "捉え方も温度も逆。「判断を保つ」相手とは根本からすれ違いやすい。"], ["無意識の結界師", "片や気配、片や理屈。「日常を守る」相手とは見ている世界が違う。"]], "special": {"skill": "霊よ、こんにちは（れいよ、こんにちは）", "skill_desc": "怖がる人が立ち止まる場所で、あなたはただ「いるー？」と声をかける。身構えない。怯えない。そのあっけらかんとした一声が、重く閉じていた空気をほぐしてしまう。恐れのなさが、最強の挨拶になる。", "good_spirit": "動物霊・子どもの霊・いたずら霊", "good_desc": "軽やかで純粋な存在が、あなたのムードに引き寄せられる。怖がらないから、彼らも素直に近づいてくる。", "bad_spirit": "試す霊・悪戯霊", "bad_desc": "壁を作らないぶん、からかいたがる存在も寄ってきやすい。「なんか変だな」と感じたら、珍しく距離を取ることが大事。"}}, "XLRB": {"name": "鋼鉄の霊査官", "code": "XLRB", "score": 58, "axes": [["X", "干渉"], ["L", "科学"], ["R", "畏怖"], ["B", "構築"]], "catch": ["私はこの世界で起きるすべてに、", "納得のいく説明を求める。"], "profile": ["あなたは、納得できないことを放置できない人だ。", "みんなが「すごい」で済ませる場面で、あなただけが「待て、本当にそうか?」と立ち止まる。雰囲気や思い込みに流されず、その奥にある仕組みを暴かずにはいられない。あなたは、信じない人ではない——簡単には信じない人だ。", "この知性は、世界の「バグ」を見抜く力だ。怪奇現象の多くは、人の心と思い込みが生み出した錯覚。あなたはそれを冷静に解体し、本物と偽物を選り分けることができる。感情に流されないその目は、誰もが持てるものではない。", "ただ、あなたは「なんでも否定する人」ではない。神社では作法通りに参拝する。お盆には墓参りに行く。しきたりはしきたりとして、きちんと守る。「信じるかどうか」と「礼儀を尽くすかどうか」は、あなたの中では別の話だ。その切り分けができる人は、意外と少ない。", "あなたは、確かめる人だ。証拠を集め、論理を組み立て、自分の頭で真実にたどり着く。そして解体できなかったものに対しては、軽々しく口にしない。笑い飛ばさない。それがあなたの、知性の礼節だ。", "歴史を動かしてきたのは、いつもこういう人たちだった。「みんなが信じているが、本当か?」と問い直した者。怪異や奇跡とされたものの正体を、一つずつ突き止めていった探究者たち。そして彼らの多くは、解明できなかったものの前で、静かに筆を置いた。あなたは、その系譜にいる。", "だが——もし、あなたの鋼鉄の論理が、どうしても説明できない何かに出会ったとしたら? すべてを解き明かしてきたあなたの理性が、初めて揺らぐその瞬間にこそ、本物が潜んでいる。あなたは、真実を見極める霊査官なのだ。"], "logs": [["深夜の異音を、頭の中で即解体する", "壁が鳴っても怯える前に、「木材の収縮か、配管か」と脳内で原因候補が並ぶ。納得できれば秒で眠れる。"], ["神社では、作法通りにやる", "信仰があるわけではない。でも二礼二拍手一礼は崩さない。「しきたりはしきたり」という、自分なりの線引きがある。"], ["怖い話の矛盾点を無意識に探す", "真剣に向き合うからこそ、照明条件や時間帯の矛盾が見えてしまう。茶化しているのではない。"]], "strengths": [["並外れた観察力と分析力", "現象の表面でなく、背後の構造を見る。誰もが感情で反応する場面で、原因と仕組みを把握できる。"], ["感情に流されない判断力", "パニックの中心でも冷静に最適解を導ける。危機の場面で必ず頼られる存在になる。"], ["知的誠実さ", "安易に信じず、安易に否定もしない。証拠と論理で態度を決める、SNS時代の希少な美徳。"]], "shadows": [["説明できないものへの過剰な警戒", "「分からない」を許容するのが苦手。すべてに説明を求める姿勢は、説明できない優しさや美しさまで切り捨てる危険を持つ。"], ["感情の言語化が遅れる", "論理が先に立つため、感情を「処理すべき情報」として扱いがち。感情はデータでなく、それ自体が大事な情報だと忘れずに。"]], "pain": ["考えすぎると言われる", "納得できないと前に進めない", "感情より先に分析してしまう"], "pain_close": "これは冷たさではなく、真実に対して誠実すぎる感性ゆえ。その慎重さは、世界への敬意のかたちです。", "rx": ["考えすぎループから抜ける方法", "「分からない」を抱えておく技術", "分析と感情のバランスの取り方"], "psy": [["鏡が映したもの", "あなたが選んだ手 ── 分析", "あなたは手の正体を突き止めようとする。真実を畏れ敬う霊査官の感性がここに。"], ["背後の咀嚼音", "あなたが聞いた音 ── 理性", "あなたが今すり減らしているのは「冷静な理性」。考えすぎて、判断の燃料を使い果たしていませんか。"], ["魂が恐れるもの", "あなたが恐れた終わり ── 無理解", "あなたが最も恐れるのは「解き明かせないまま終わること」。探究者の影がここに。"]], "truth": "ここまで、あなたは多くの偽物を解体してきた。だが、本当に問うべきはその先だ。——もし、あなたの鋼鉄の論理が、どうしても説明できない何かに出会ったら? すべてを暴いてきたその理性が、初めて揺らぐ瞬間にこそ、本物は潜んでいる。その「説明のつかない領域」の記録は、まだここには書かれていない。", "lp_lead": "徹底して調べる理由を知り、結論を恐れず示す道を。", "share": "当たってる…。私は【鋼鉄の霊査官】でした。\"納得できないと進めない\"のは誠実さだった。", "best": [["闇切りの狩人", "世界の捉え方も感じ方も近く、「危険を察する」相手と深く響き合う。"], ["好奇の検証者", "同じ理屈で世界を捉え、「面白がる」姿に安心できる。"], ["崇高なるリアリスト", "世界の捉え方も感じ方も近く、「静かに観る」相手と深く響き合う。"]], "worst": [["迷宮の亡霊", "捉え方も温度も逆。「境を越える」相手とは根本からすれ違いやすい。"], ["夢幻の巡礼者", "捉え方も温度も逆。「意味を読む」相手とは根本からすれ違いやすい。"], ["霊界のムードメーカー", "捉え方も温度も逆。「勘で動く」相手とは根本からすれ違いやすい。"]], "special": {"skill": "霊的解析眼（れいてきかいせきがん）", "skill_desc": "「これは本当か」を最後まで問い続ける力。霊的現象も人間のトリックも、同じ目で冷静に分析する。感情に流されず、証拠と論理で偽物を選り分ける知性。", "good_spirit": "トリック・思い込み・集団心理", "good_desc": "怪奇現象の9割は、人の心と思い込みが生む錯覚——それを冷静に見抜けるのがこのタイプ。「信じたい」という空気に流されず、本物と偽物を選り分けられる。", "bad_spirit": "論理の通じない、本物", "bad_desc": "あらゆる偽物を解体してきたあなたが、どうしても説明のつかない何かに出会うとき——その時こそ、あなたの理性は初めて揺らぐ。本物は、いつも論理の外側にいる。"}}, "XLRF": {"name": "闇切りの狩人", "code": "XLRF", "score": 60, "axes": [["X", "干渉"], ["L", "科学"], ["R", "畏怖"], ["F", "流動"]], "catch": ["侮れないと知っている。", "だから、確かめずにいられない。"], "profile": ["あなたは、自分の直感を信じて動く人だ。", "霊が存在するかどうか、断言はできない。でも、馬鹿にする気にもなれない。神社では一礼する。嫌な感じがする場所には近づかない。「なんとなく変だ」と感じたとき、それを笑い飛ばせない——理屈ではなく、侮ってはいけないものがある、と体が知っている。", "あなたの目は、ごまかしを見逃さない。話のつじつまが合わない瞬間。場の空気が一瞬こわばる瞬間。誰かが本心を隠した瞬間——みんなが聞き流す小さな違和感を、あなたは正確に拾い上げる。「考えすぎ」と笑われても、あとになって「あなたの言った通りだった」となる。そんな経験が、何度もあるはずだ。", "あなたは狩人だ。獲物を前にしたとき、考えるより先に体が動く。直感が「こっちだ」と言ったら、もう足が向いている。計画を立てて動くのではなく、感じたまま追う。そして追い始めたら、確かめるまで止まれない。", "論理は持っている。でも論理より先に、体が動く。その順番が、あなたの追い方だ。", "古来、夜の森を駆けた狩人がいました。彼らは霊を信じていたわけではない。でも、森を侮らなかった。暗闇の気配を軽視しなかった。「なんとなくおかしい」を無視しなかった。その畏怖と直感の組み合わせが、彼らを最も鋭い狩人にした。あなたの中には、その血が流れている。", "あなたが「気になる」を放置できないのは、それを侮ってはいけないと知っているからだ。直感を信じて、畏れを持って、追い続ける——あなたは、夜霧の中の孤高の追跡者なのだ。"], "logs": [["「なんとなく」が外れない", "理由のない違和感が来たとき、無視せずに動いた結果、たいてい何かある。その精度が、自分でも少し不思議になることがある。"], ["嫌な感じがする場所は、なんとなく避ける", "信仰があるわけじゃない。でも「やっておいた方がいい」という感覚で、自然と足が止まる。しきたりはしきたりとして、守る。"], ["気になると確かめずにいられない", "普通の人が「まあいいか」で済ませる場面で、あなただけが一歩踏み込んでしまう。怖いというより、放置できない。"]], "strengths": [["侮らない慎重さ", "相手を過小評価しない。だからこそ最悪を想定でき、危機を未然に防げる。"], ["危険を察知する勘", "言葉にならない兆候から異変を嗅ぎ取る。理屈より先に体が警告を出す。"], ["緊張下での集中力", "危機の只中でこそ冴える。恐れを力に変え、核心へ最短で迫る。"]], "shadows": [["気が休まらない", "常に警戒を解けず、安全な場所でも緊張している。休息の下手さが消耗を生む。"], ["無謀に踏み込む危うさ", "畏れているのに近づいてしまう。その一歩が、時に自分を危険に晒す。"]], "pain": ["気になると確かめずにいられない", "危険を感じ取りすぎて気が休まらない", "警戒心が強いと言われる"], "pain_close": "これは臆病さではなく、侮れぬものを侮れぬと正しく感じ取れる感性ゆえ。その警戒は、あなたを守る力です。", "rx": ["警戒心で消耗しない休め方", "無謀に踏み込まない「畏れの羅針盤」", "緊張を共有できる相棒の見つけ方"], "psy": [["鏡が映したもの", "あなたが選んだ手 ── 警戒", "あなたは手を侮らず身構える。侮れぬものを察知する追跡者の感性がここに。"], ["背後の咀嚼音", "あなたが聞いた音 ── 安らぎ", "あなたが今すり減らしているのは「安らぎ」。警戒を解けず、心の休まる時間が削られていませんか。"], ["魂が恐れるもの", "あなたが恐れた終わり ── 油断", "あなたが最も恐れるのは「侮って取り返しがつかなくなること」。畏れる者の影がここに。"]], "truth": "あなたの「なんとなく」は、なぜ当たるのか。直感を信じて追い続けてきたあなたが、それでも掴めなかったものがある。その正体は何なのか。畏れを持って生きた狩人たちは、追い続けた先で何を見たのか。その記録は、まだここには書かれていない。", "lp_lead": "警戒する理由を知り、勘を武器に変える道を。", "share": "当たってる…。私は【闇切りの狩人】でした。\"考えすぎ\"と言われた勘は、いつも正しかった。", "best": [["鋼鉄の霊査官", "世界の捉え方も感じ方も近く、「徹底して解く」相手と深く響き合う。"], ["閃光の突撃者", "同じ理屈で世界を捉え、「飛び込む」姿に安心できる。"], ["世界平和の祈り人", "世界の捉え方も感じ方も近く、「判断を保つ」相手と深く響き合う。"]], "worst": [["夢幻の巡礼者", "捉え方も温度も逆。「意味を読む」相手とは根本からすれ違いやすい。"], ["迷宮の亡霊", "捉え方も温度も逆。「境を越える」相手とは根本からすれ違いやすい。"], ["招霊の主", "捉え方も温度も逆。「対話でつなぐ」相手とは根本からすれ違いやすい。"]], "special": {"skill": "異変察知の眼（いへんさっちのめ）", "skill_desc": "論理より先に体が知っている。「なんかおかしい」を誰より早く掴み、直感のまま追う。畏れを持った現実主義者の、鋭い感覚。", "good_spirit": "嘘・矛盾・見えない危険", "good_desc": "言葉と行動のズレ、隠された意図、崩れかけた状況——あなたのセンサーは、他の人が見逃すサインを拾い上げる。「気にしすぎ」と言われるが、たいてい当たっている。", "bad_spirit": "正体を掴ませない気配", "bad_desc": "危険ならいくらでも追える。だが、追っても追っても正体を現さない気配——理由のわからない悪寒、説明できない視線。それだけは、あなたの鋭い嗅覚をもってしても掴みきれない。"}}, "XLKB": {"name": "好奇の検証者", "code": "XLKB", "score": 52, "axes": [["X", "干渉"], ["L", "科学"], ["K", "親和"], ["B", "構築"]], "catch": ["不思議は怖いものじゃない。", "面白いものだ。"], "profile": ["あなたは、怖いものより「面白いもの」を見つけてしまう人だ。", "不思議な現象を前にすると、ほとんどの人が身を引くなかで、あなただけが前のめりになる。「これ、どういう仕組み?」——恐怖より好奇心が勝ってしまう。心霊スポットも、お化け屋敷も、あなたにとっては最高の遊び場だ。", "これは、不真面目なのではない。世界を「怖いもの」ではなく「面白いもの」として見られる、稀有な目だ。人が逃げ出す場所に嬉々として近づき、観察し、記録し、検証する。その胆力があるから、あなたは誰も気づかなかった真相にたどり着ける。", "あなたは、未知を恐れず確かめにいける。聞いた話を鵜呑みにせず、自分で試さずにいられない。その実験精神こそが、世界を前に進めてきた。あなたは、闇すら研究対象にできる、生まれながらの探究者だ。", "世界の謎を解き明かしてきたのは、いつもこういう人たちだった。「怖い」より「面白い」が勝ってしまう者。誰もが避けるものに嬉々として近づいた探検家や発明家——彼らの無邪気な好奇心が、人類の知を押し広げてきた。あなたは、その系譜にいる。", "あなたの尽きない好奇心は、人生を退屈から遠ざける最大の武器だ。あなたは、闇さえ面白がって覗き込む——好奇の検証者なのだ。"], "logs": [["心霊スポットに嬉々として行く", "怖がる友人を尻目に、「どういう条件で何が起きるのか」を観察するのが楽しい。"], ["ジンクスをあえて「仕様変更」してみる", "「右足から靴を履くと運が良い」と聞くと、あえて左足から履いてみて、本当に変わるか気になってしまう。"], ["「不真面目」と誤解される", "真剣に向き合っていないように見えるが、本人はいたって本気で面白がっている。"]], "strengths": [["恐れない実験精神", "未知を怖がらないので、誰も手を出さない領域に大胆に踏み込める。"], ["旺盛な好奇心", "「なぜ?」「どうやって?」が尽きない。世界のすべてが面白い。"], ["記録と検証の継続力", "面白がりながらも、コツコツ条件を変えて試し、データを積み上げられる。"]], "shadows": [["真剣さが足りないと誤解される", "面白がる姿勢が、不謹慎・不真面目と受け取られることがある。"], ["興味が移ろいやすい", "一つを最後まで極める前に、次の謎へ。やり切れない癖。"]], "pain": ["真剣さが足りないと誤解される", "何でも実験対象にすると言われる", "興味が次々移る"], "pain_close": "これは不真面目ではなく、世界を恐れず楽しめる健やかな感性ゆえ。その軽やかさは、探究を続ける力です。", "rx": ["興味を最後までやり切る習慣化", "「遊び」を信頼に変える見せ方", "一緒に面白がる仲間の作り方"], "psy": [["鏡が映したもの", "あなたが選んだ手 ── 好奇", "あなたは手に怯えるより興味を持つ。未知を贈り物と捉える検証者の感性がここに。"], ["背後の咀嚼音", "あなたが聞いた音 ── 集中力", "あなたが今すり減らしているのは「集中力」。興味が次々移り、一点に注ぐ力が散っていませんか。"], ["魂が恐れるもの", "あなたが恐れた終わり ── 退屈", "あなたが最も恐れるのは「面白いものが尽きること」。好奇の人の影がここに。"]], "truth": "ここまで、あなたは数々の怪異を「面白い研究対象」にしてきた。だが、本当に知りたいのはその先だろう。——いくら観察しても法則が見えず、再現も説明もできない現象に出会ったとき、あなたの好奇心はどこまで届くのか。検証を拒む「底なしの謎」の記録は、まだここには書かれていない。", "lp_lead": "面白がる理由を知り、やり切る力に変える道を。", "share": "当たってる…。私は【好奇の検証者】でした。\"何でも実験する\"のは世界を愛してたから。", "best": [["閃光の突撃者", "世界の捉え方も感じ方も近く、「飛び込む」相手と深く響き合う。"], ["鋼鉄の霊査官", "同じ理屈で世界を捉え、「徹底して解く」姿に安心できる。"], ["無意識の結界師", "世界の捉え方も感じ方も近く、「日常を守る」相手と深く響き合う。"]], "worst": [["慈愛の依代", "捉え方も温度も逆。「痛みを抱く」相手とは根本からすれ違いやすい。"], ["天啓の預言者", "捉え方も温度も逆。「未来を視る」相手とは根本からすれ違いやすい。"], ["神宿りの舞手", "捉え方も温度も逆。「神を宿す」相手とは根本からすれ違いやすい。"]], "special": {"skill": "怪異検証術（かいいけんしょうじゅつ）", "skill_desc": "未知の現象を怖がらず、好奇心で観察・記録・検証する力。「怪しい」を「面白い」に変換できる胆力。感情を切り離して現象と向き合える稀有な知性。", "good_spirit": "未解明現象・心霊スポット・怪談", "good_desc": "霊か錯覚かを問わず「不思議な現象」そのものを楽しめる。怖くないから近づける。近づけるから、誰も調べなかった真相にたどり着ける。", "bad_spirit": "検証を拒む、底なしの謎", "bad_desc": "どんな怪異も「面白い研究対象」にできるあなた。でも——いくら観察しても法則が見えず、再現も説明もできない現象に出会ったとき。好奇心が、初めて畏れに変わるかもしれない。"}}, "XLKF": {"name": "閃光の突撃者", "code": "XLKF", "score": 54, "axes": [["X", "干渉"], ["L", "科学"], ["K", "親和"], ["F", "流動"]], "catch": ["気になったら、", "もう足が動いている。"], "profile": ["あなたは、気になった瞬間にもう動いている人だ。", "「ちょっと待って、考えてから——」そんな言葉が追いつく前に、体がもう走り出している。心霊スポットの話を聞いたら「行ってみようよ」、怖い話を聞いたら「本当かどうか確かめたい」、謎があったら「現場に行けば分かる」。怖さより先に、好奇心と行動力が出てしまう。", "まわりから「落ち着きがない」「衝動的すぎる」と言われたことがあるかもしれない。でも、それは弱点ではない。あなたには、動きながら考えるという特殊な知性がある。机の前でどれだけ悩んでも分からないことが、現場に一歩踏み込んだだけで分かってしまう。あなたにとって、行動は最速の思考だ。", "あなたは霊的なものを特別視しない。怖いというより、面白い。「いるかもしれない」と思っても、逃げるより確かめたくなる。その軽やかさが、他の人が近づけない場所への扉を開ける。誰も答えを出せなかった謎に、あなたが一番乗りで踏み込んでいく。", "歴史上の発見の多くは、慎重な計画者ではなく、衝動的な行動者によってもたらされてきました。「面白そうだから行ってみた」「気になったから試してみた」——その瞬発力が、誰も見たことのなかった景色を切り開いてきた。あなたの「とりあえず行く」は、その系譜にある。", "あなたの衝動は、真実への最短距離だ。気になれば闇の奥にも真っ先に踏み込んでいく——あなたは、閃光の突撃者なのだ。"], "logs": [["怖い話を聞くと、確かめたくなる", "「本当にそんな場所があるの?」となったら、もう次の週末に行く計画を立てている。怖いというより、楽しみ。"], ["ルールよりその時のノリで動く", "旅行も仕事も、計画より現地の閃きで書き換える。思考は論理的なのに、行動は完全に即興。"], ["「なんか変」が頭から離れない", "通りすがりに気になった場所。もう離れているのに、あの違和感だけがずっと頭の隅に残っている。次に通ったとき、確認しに行く。"]], "strengths": [["直感と論理を行き来する柔軟性", "状況に応じて切り替えられる、訓練された知性。多くの人がどちらかに偏る中で稀有。"], ["現場感覚の鋭さ", "紙の上の分析より、その場に立った瞬間の空気で判断できる。生きた情報を扱える。"], ["孤独な行動力", "仲間を待たず、気になったらすぐ動く瞬発力。誰にも真似できない武器。"]], "shadows": [["衝動と気まぐれの紙一重", "「直感」と「思いつき」の境界が自分でも分からなくなる。重要な決断こそ一度立ち止まる訓練を。"], ["説明責任を軽視しがち", "自分の中では筋が通っていても、他人には「なぜ」が見えにくい。周囲を置き去りにする癖は孤立を招く。"]], "pain": ["落ち着きがないと言われる", "気になると止まれない", "飽きやすい"], "pain_close": "これは軽薄さではなく、好奇心が健やかに働いている証。その身軽さは、誰も行かない場所へ行ける力です。", "rx": ["飛び込む前の「一呼吸」の入れ方", "勘を観察で裏づける方法", "飽きずに続ける興味の保ち方"], "psy": [["鏡が映したもの", "あなたが選んだ手 ── 興味", "あなたは手に好奇心で近づく。未知を楽しむ探偵の感性がここに。"], ["背後の咀嚼音", "あなたが聞いた音 ── 落ち着き", "あなたが今すり減らしているのは「落ち着き」。動き続けて、じっとする力が削られていませんか。"], ["魂が恐れるもの", "あなたが恐れた終わり ── 停滞", "あなたが最も恐れるのは「何も起きないこと」。動き続ける者の影がここに。"]], "truth": "あなたはどんな謎にも真っ先に飛び込んできた。怖いより面白いが、いつも勝ってきた。でも——底が見えない、近づくほど空気が重くなる、笑えなくなる場所がある。好奇心が初めて沈黙する瞬間。あなたの突撃本能が、珍しく止まる何か。その「底知れない闇」の正体は、まだここには書かれていない。", "lp_lead": "飛び込める理由を知り、最短で真実に至る道を。", "share": "当たってる…。私は【閃光の突撃者】でした。\"気になると止まれない\"のは才能だった。", "best": [["好奇の検証者", "世界の捉え方も感じ方も近く、「面白がる」相手と深く響き合う。"], ["闇切りの狩人", "同じ理屈で世界を捉え、「危険を察する」姿に安心できる。"], ["無縁の自由人", "世界の捉え方も感じ方も近く、「軽く流す」相手と深く響き合う。"]], "worst": [["天啓の預言者", "捉え方も温度も逆。「未来を視る」相手とは根本からすれ違いやすい。"], ["慈愛の依代", "捉え方も温度も逆。「痛みを抱く」相手とは根本からすれ違いやすい。"], ["降霊の執行者", "捉え方も温度も逆。「作法で鎮める」相手とは根本からすれ違いやすい。"]], "special": {"skill": "閃光突撃（せんこうとつげき）", "skill_desc": "気になったら0.5秒で動いている。考える前に現場に立ち、行動しながら答えを掴む。その瞬発力が、慎重な人には永遠に見えない景色を見せてくれる。", "good_spirit": "謎・未確認情報・現場の違和感", "good_desc": "「行って確かめればいい」と思えるのがこのタイプの強み。現場に立てば、机の前では見えなかった答えが転がっている。", "bad_spirit": "底知れぬ闇を持つ怪異", "bad_desc": "いつもは怖いより面白いが先に来る。でも——底が見えない、近づくほど重くなる、笑えなくなる何かがある。好奇心が沈黙する瞬間。そういう怪異だけは、あなたの突撃本能が珍しく止まる。"}}, "NLRB": {"name": "崇高なるリアリスト", "code": "NLRB", "score": 56, "axes": [["N", "受信"], ["L", "科学"], ["R", "畏怖"], ["B", "構築"]], "catch": ["信じるかどうかより、", "礼節があるかどうかだ。"], "profile": ["あなたは、自分の軸で生きている人だ。", "霊が存在するかどうか、正直よく分からない。でも、だからといって馬鹿にする気にもなれない。神社では作法通りにする。古い場所には敬意を持って入る。「信じるかどうか」と「礼節を持つかどうか」は、あなたの中では別の話だ。", "あなたは、喧騒に飲まれない。怖がる人が騒いでいても、信じる人が熱くなっていても、どちらにも流されない。自分の目で見て、自分の頭で考えて、自分の基準で判断する。その静けさは、冷たさではない。ただ、揺れないだけだ。", "自分を律することが、自然にできる人だ。決まった習慣がある。乱れたら整える。感情が高ぶっても、外に出す前に一度自分の中で処理する。その自律が、あなたの品格になっている。周りから「落ち着いている」「大人だ」と言われることが多いかもしれない。", "見えない世界とは、積極的に関わろうとは思わない。でも、否定もしない。「そういうものがあるのかもしれない」という感覚を、静かに持ったまま、日常を丁寧に生きている。それがあなたの、現実との向き合い方だ。", "古来、どんな文化にも「乱れない人」がいました。嵐の中でも姿勢を崩さなかった武士、喧騒の中で静かに祈り続けた僧侶、感情に流されず記録を続けた学者——彼らは特別な力を持っていたわけではない。ただ、自分を律し、礼節を守り続けた。その姿勢が、周りの人々の拠り所になった。あなたは、その系譜にいる。", "あなたが揺れないのは、自分の軸を持っているからだ。信じるかどうかより、礼節があるかどうか——それがあなたの、崇高なる現実主義だ。"], "logs": [["神社では、作法通りにやる", "信仰があるわけではない。でも二礼二拍手一礼は崩さない。「しきたりはしきたり」という、静かな一線がある。"], ["怖い話を聞いても、すぐには反応しない", "否定もしないし、飛びつきもしない。「そういうこともあるかもしれない」と、静かに受け取っておく。"], ["乱れた場所に入ると、自然と整えたくなる", "特別なことをするわけではない。ただ、自分のペースと姿勢を崩さないでいることが、その場を落ち着かせていく。"]], "strengths": [["動じない静けさ", "世界が騒がしくなるほど静かになる。この精神性は、霊的な干渉への最強の盾でもある。"], ["客観性の徹底", "自分の感情にすら距離を取れる。最も歪みのない視点で世界を見られる。"], ["沈黙の重み", "普段語らないからこそ、一言に重みが宿る。「あれは変だった」の一言が、場を凍らせる。"]], "shadows": [["共有しない孤独", "豊かすぎる内面を誰とも分かち合えない。「気配を感じた」と話してもピンと来てもらえず、一人で向こう側を見ている感覚に襲われる。"], ["動くべき瞬間を逃す", "違和感を察知しても「様子を見よう」と保留する間に、その気配が居着いてしまうことがある。"]], "pain": ["何を考えているか分からないと言われる", "感情を出すのが苦手", "ひとりが楽"], "pain_close": "これは冷たさではなく、感じたものを軽々しく扱わない誠実さゆえ。距離を取る静けさは、あなたの品位です。", "rx": ["観察を孤立に変えない方法", "静けさを保ちつつ人と繋がる術", "蓄積した洞察の活かし方"], "psy": [["鏡が映したもの", "あなたが選んだ手 ── 観察", "あなたは手を静かに見定める。軽々しく動かない観測者の感性がここに。"], ["背後の咀嚼音", "あなたが聞いた音 ── 社会的つながり", "あなたが今すり減らしているのは「人とのつながり」。距離を保ちすぎて、孤立が深まっていませんか。"], ["魂が恐れるもの", "あなたが恐れた終わり ── 忘却", "あなたが最も恐れるのは「記録が失われること」。観る者の影がここに。"]], "truth": "あなたは礼節を持って、静かに生きてきた。それで十分だと思っていた。でも——礼節が通じない存在がいる。作法を尽くしても、構わず踏み込んでくる理不尽な何かがいる。自分を律し続けてきたあなたが、初めて「これはどうすればいいのか」と立ち止まる瞬間がある。その問いへの答えは、まだここには書かれていない。", "lp_lead": "反応しない理由を知り、記録を世界に開く道を。", "share": "当たってる…。私は【崇高なるリアリスト】でした。\"何を考えてるか分からない\"のは静かな畏敬だった。", "best": [["世界平和の祈り人", "世界の捉え方も感じ方も近く、「判断を保つ」相手と深く響き合う。"], ["鋼鉄の霊査官", "世界の捉え方も感じ方も近く、「徹底して解く」相手と深く響き合う。"], ["無意識の結界師", "同じ理屈で世界を捉え、「日常を守る」姿に安心できる。"]], "worst": [["霊界のムードメーカー", "捉え方も温度も逆。「勘で動く」相手とは根本からすれ違いやすい。"], ["招霊の主", "捉え方も温度も逆。「対話でつなぐ」相手とは根本からすれ違いやすい。"], ["神宿りの舞手", "片や気配、片や理屈。「神を宿す」相手とは見ている世界が違う。"]], "special": {"skill": "不動の礼節（ふどうのれいせつ）", "skill_desc": "何があっても揺れない。その静けさと礼節が、見えない世界との自然な均衡を保つ。乱れない者の周りには、乱れたものが近づきにくい。", "good_spirit": "歴史の痕跡・静かに在る存在", "good_desc": "長く在り続けてきた存在は、礼節を持って接するあなたに安心する。騒がず、ただそこにいるあなたに、彼らは近づきやすい。", "bad_spirit": "理不尽な怪異", "bad_desc": "礼節を持って接すれば相手も応じてくれる——あなたはそう信じている。でも、この世には作法も敬意も通じない、ただ理不尽に荒れ回る存在がある。あなたの静けさも礼節も、まったく届かない何か。そういう存在の前では、あなたの「軸」が初めて試される。"}}, "NLRF": {"name": "世界平和の祈り人", "code": "NLRF", "score": 50, "axes": [["N", "受信"], ["L", "科学"], ["R", "畏怖"], ["F", "流動"]], "catch": ["信じるより先に、", "願っている。"], "profile": ["あなたは、争わない人だ。", "霊がいるかどうか、神がいるかどうか——正直、断言できない。でも「どうせいない」と切り捨てる気にもなれない。むしろ、見えないものも含めて、世界がうまくいってほしいと思っている。信仰というより、願い。宗教というより、感覚。それがあなたの、世界との関わり方だ。", "白黒つけることが苦手だ。「あいつが悪い」「これが正しい」という断定が、どうも居心地悪い。どちらにも事情があるように見えてしまう。霊的なものに対しても同じで、否定する気にも、盲目的に信じる気にもなれない。ただ「そういうものもあるのかもしれない」と、静かに手放さずにいる。", "あなたは、調和を大切にする人だ。場が荒れているとき、自然と間に入りたくなる。争っている人を見ると、どちらの気持ちも分かって、なんとかならないかと思う。それは政治的な意味での平和主義ではなく、もっと素朴な感覚——ただ、みんなが少し楽になってほしい、という願いだ。", "宗教も信仰も持たないのに、自然に手を合わせる人がいます。特定の神を信じていないのに、誰かのために祈れる人がいます。その祈りは、形式ではなく、純粋な願いから生まれている。古来、そういう人の祈りが、不思議と届くことがあると言われてきました。あなたは、その系譜にいます。", "あなたが争わず、決めつけず、ただ願い続けるのは——世界がそれだけ、あなたにとって大切だからだ。信じるより先に、願っている。あなたは、世界平和の祈り人なのだ。"], "logs": [["手を合わせる場所がある", "神社でも、お寺でも、特に信仰があるわけじゃない。でも自然と足が止まって、手を合わせてしまう場所がある。"], ["争っている人を見ると、なんとかしたくなる", "どちらが正しいかより、「どうすれば収まるか」が先に気になる。"], ["不思議な体験を「良いことに解釈する」", "怖い体験も、不思議な現象も、「悪いものじゃないかも」と自然に思える。恐怖より、意味を探したくなる。"]], "strengths": [["真偽を急がない誠実さ", "騙されにくく、同時に真実も見逃さない。現代において最も希少なリテラシー。"], ["柔軟な思考の幅", "固定された立場を持たないため、予想外の真実にもアクセスできる。"], ["周囲への安心感", "「何を言っても変な反応はしない」——その安心が、人に深い話をさせる。"]], "shadows": [["立場を持たない代償", "「結局どう思ってるの?」に答えられずモヤモヤする。助けを求められても引き気味になり、相手を孤独にすることも。"], ["行動の遅さ", "「霊障かも」と感じても確信が持てず、対処を始められないまま長引かせることがある。"]], "pain": ["はっきりしないと言われる", "考えすぎて決められない", "人を信じきれない"], "pain_close": "これは臆病さではなく、真実を雑に扱えない誠実さゆえ。その保留する力は、騙されない強さでもあります。", "rx": ["保留と優柔不断を分ける線引き", "ここぞで決める勇気の出し方", "慎重さを信頼に変える伝え方"], "psy": [["鏡が映したもの", "あなたが選んだ手 ── 保留", "あなたは手を即断せず見極める。軽率に断じない懐疑者の感性がここに。"], ["背後の咀嚼音", "あなたが聞いた音 ── 決断力", "あなたが今すり減らしているのは「決断力」。保留を重ねて、前に進む力が削られていませんか。"], ["魂が恐れるもの", "あなたが恐れた終わり ── 誤断", "あなたが最も恐れるのは「軽率に信じて欺かれること」。見極める者の影がここに。"]], "truth": "あなたはずっと、世界がうまくいってほしいと願ってきた。でも、こんな問いが残っているかもしれない。——祈りは、本当に届くのか。すべてを包む願いに、力はあるのか。そして、祈りが届かない存在と出会ったとき、あなたはどうするのか。その答えは、まだここには書かれていない。", "lp_lead": "断じない理由を知り、見極めの達人になる道を。", "share": "当たってる…。私は【世界平和の祈り人】でした。\"はっきりしない\"のは真実を雑に扱えないからだった。", "best": [["崇高なるリアリスト", "世界の捉え方も感じ方も近く、「静かに観る」相手と深く響き合う。"], ["闇切りの狩人", "世界の捉え方も感じ方も近く、「危険を察する」相手と深く響き合う。"], ["無縁の自由人", "同じ理屈で世界を捉え、「軽く流す」姿に安心できる。"]], "worst": [["招霊の主", "捉え方も温度も逆。「対話でつなぐ」相手とは根本からすれ違いやすい。"], ["霊界のムードメーカー", "捉え方も温度も逆。「勘で動く」相手とは根本からすれ違いやすい。"], ["降霊の執行者", "片や気配、片や理屈。「作法で鎮める」相手とは見ている世界が違う。"]], "special": {"skill": "万愛の祈り（ばんあいのいのり）", "skill_desc": "宗派も形式も超越した、すべてを包む祈り。霊も人も、この世もあの世も、ただ「安らかであれ」と願える人。その祈りは相手の痛みを静かに癒し、荒れた世界をわずかに和らげる。祈ることが、力になる。", "good_spirit": "迷える存在・成仏できない霊", "good_desc": "断定せず、ただ「安らかに」と願えるあなたの前では、さまよっている存在が少し落ち着く。信仰のない祈りが、純度を持つことがある。", "bad_spirit": "理不尽な悪意を持つ怪異", "bad_desc": "調和を願うあなたには、純粋な悪意や理不尽な力が最も扱いにくい。祈りが届かない存在の前で、あなたは初めて無力を感じる。"}}, "NLKB": {"name": "無意識の結界師", "code": "NLKB", "score": 44, "axes": [["N", "受信"], ["L", "科学"], ["K", "親和"], ["B", "構築"]], "catch": ["彼らがそこにいても、", "私は私の暮らしを続ける。"], "profile": ["あなたは、気にしない人だ。", "部屋で妙な気配がしても、怖くない。「なんだろう」と一瞬思うが、だからといって何かを変える気にはならない。霊がいるかどうかも、正直よく分からないし、あまり興味もない。自分のペースとルーティンの方が、そういう話より圧倒的に大事だ。", "あなたの日常には、自分なりの秩序がある。決まった時間に起きて、決まった手順でことを進めて、自分の流儀で空間を整える。それが崩れると、何かがおかしい感じがする。霊的な話よりも、日常のリズムが乱れる方がよっぽど気になる——それがあなたの感覚だ。", "霊的なものに対しては、特別扱いしない。怖くもないし、積極的に関わろうとも思わない。「いるのかもしれないけど、まあ共存できるんじゃないか」というゆるやかな感覚。その無頓着さが、実は最強の防御になっている。乱れたものは、乱れない人の前では静まっていく。怖がらないから、隙がない。", "古来、どんな場所でも「普通に暮らし続けた人」がいました。霊が出ると言われた家に平然と住み続け、怪異が起きても日常を崩さなかった人たち——彼らを守っていたのは、特別な力ではなかった。ただ、動じなかった。その「乱れなさ」が、見えない世界との自然な均衡を作っていたのです。あなたは、その系譜にいる。", "あなたは意識せずに、自分の周りに結界を張っている。特別なことは何もしていない。ただ、自分のペースで生きているだけ。それが、あなたの静かで強い才能だ。あなたは、無意識の結界師なのだ。"], "logs": [["怪異が起きても、やることをやる", "妙な気配がしても、「なんだろう」とは思う。でも今やっていることの方が先だ。スキンケアを終わらせてから考える。"], ["自分の空間は、自分の流儀で整える", "他人の家には無頓着でも、自分の部屋は自分のルールで整っていないと落ち着かない。その秩序が、安定の根拠になっている。"], ["霊的な話を聞いても、引きずらない", "怖い話を聞いても、その夜には別のことを考えている。共感はするが、飲み込まれない。"]], "strengths": [["自分の生活を守る強さ", "何が起きてもペースを崩さない。最高の精神的防御であり、長く健やかに生きる秘訣。"], ["騒がず共存する知性", "霊的なものを敵にも味方にもせず「在るもの」として扱える、大人の感性。"], ["安心を分け与える存在", "このタイプが揺るがないと、周りも揺れなくなる。集団の錨のような人。"]], "shadows": [["閉じすぎる傾向", "「関わらない」を貫きすぎ、対話で解決できた問題を長期的に抱え込むことがある。"], ["静観しすぎるリスク", "突発的な異変には強いが、じわじわ侵食してくるものには気づくのが遅れる。"]], "pain": ["真面目すぎる・融通が利かないと言われる", "ルーティンが乱れると不安", "動じなさを冷たいと誤解される"], "pain_close": "これは頑固さではなく、日常を聖域として守る力ゆえ。その安定は、周りをも守ります。", "rx": ["ルーティンを守りつつ緩める柔らかさ", "動じなさを温かく伝える方法", "自分の聖域の整え方"], "psy": [["鏡が映したもの", "あなたが選んだ手 ── 不動", "あなたは手にも動じず日常を保つ。揺るがぬ守り人の感性がここに。"], ["背後の咀嚼音", "あなたが聞いた音 ── 柔軟さ", "あなたが今すり減らしているのは「柔軟さ」。日常を守りすぎて、変化に応じる力が固まっていませんか。"], ["魂が恐れるもの", "あなたが恐れた終わり ── 崩壊", "あなたが最も恐れるのは「日常が壊れること」。守る者の影がここに。"]], "truth": "あなたはただ、自分の日常を生き let qi=0;
let ansHistory=[];
const ax={X:0,N:0,L:0,O:0,R:0,K:0,B:0,F:0}; const stage=document.getElementById('stage');
function setP(p,prog){document.body.style.setProperty('--p',p);document.querySelector('.prog').style.setProperty('--prog',prog);}
function progress(){return qi/QUESTIONS.length;}
function actP(act){ if(act.indexOf('一')>=0)return .08; if(act.indexOf('二')>=0)return .35; if(act.indexOf('三')>=0)return .7; return .95; }
function render(){
  if(qi>=QUESTIONS.length){return finish();}
  const q=QUESTIONS[qi];
  setP(actP(q.act), progress());
  const lines=q.text.split(String.fromCharCode(10)).map(t=>'<div>'+t+'</div>').join('');
  let inner='<div class="actlabel">'+q.act+'</div><div class="qn">Q '+(qi+1)+' / '+QUESTIONS.length+'</div><div class="q">'+lines+'</div>';
  inner+='<div class="choices">'+  q.opts.map((o,k)=>'<button type="button" class="choice" data-k="'+k+'">'+o.t+'</button>').join('')+'</div>';
  inner+=(qi>0?'<div class="back-wrap"><button class="back-btn" onclick="goBack()">← 前の質問に戻る</button></div>':'');
  stage.style.opacity=0;
  setTimeout(()=>{
    stage.innerHTML=inner;
    bind(q);stage.style.opacity=1;
  }, qi===0?0:600);
}
function bind(q){
  stage.querySelectorAll('.choice[data-k]').forEach(el=>el.onclick=()=>{
    const k=+el.dataset.k; const o=q.opts[k];
    if(q.type==='choice'){ ansHistory.push({ax:o.ax,pt:o.pt,type:'choice'}); ax[o.ax]+=o.pt; }
    adv();
  });
}
function adv(){qi++;render();}

function judge(){return (ax.X>=ax.N?'X':'N')+(ax.L>=ax.O?'L':'O')+(ax.R>=ax.K?'R':'K')+(ax.B>=ax.F?'B':'F');}
function finish(){document.getElementById('loading').classList.add('on');setTimeout(()=>{document.getElementById('loading').classList.remove('on');showResult(judge());},1800);}
function showResult(code){

  const AX_EN={"X":"eXert","N":"Negative","L":"Logic","O":"Occult","R":"Reverence","K":"Kinship","B":"Build","F":"Flow"};

  // 心理テスト核（意味ラベル＋teaser）
